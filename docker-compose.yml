services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: momen
      POSTGRES_USER: momen
      POSTGRES_PASSWORD: momen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momen -d momen"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://momen:momen@postgres:5432/momen?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in your environment}
      JWT_ACCESS_TTL: 15m
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      AUTH_COOKIE_SAME_SITE: lax
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: http://localhost:3000/checkout/payment-callback
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - media_uploads:/app/uploads

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  media_uploads:
